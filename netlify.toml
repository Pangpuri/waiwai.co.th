# การตั้งค่า deploy บน Netlify — waiwai.com (เว็บองค์กร ไทย/อังกฤษ)
#
# ⚠️ รอบที่ 21: ผู้ใช้ย้ายไป deploy บน **Vercel** เป็นหลัก (ไฟล์นี้เก็บไว้เป็นทางสำรอง)
#    บน Vercel ไม่ต้องมีไฟล์ตั้งค่าใด ๆ — ตรวจพบ Next.js เอง (Next 16 รองรับ `proxy.ts` ได้ native)
#    และ **ไม่ต้องตั้ง environment variable** เพราะเว็บนี้ไม่ใช้ env เลย
#
# ไม่ต้องเพิ่ม `@netlify/plugin-nextjs` ใน package.json:
# Netlify ตรวจพบ Next.js เองและติดตั้ง Next.js Runtime ให้ตอน build
# (runtime นั้นดูแล App Router · proxy.ts (middleware) · การย่อภาพของ next/image)
# ⚠️ ต้องเป็น runtime รุ่นล่าสุด (v5.10+) จึงรู้จัก `proxy.ts` ของ Next 16
#
# ตรวจหลัง deploy ครั้งแรก: เปิด "/" แล้วต้องเด้งไป "/th" (proxy.ts ทำ locale redirect)

[build]
  command = "npm run build"
  # ไม่ระบุ publish โดยตั้งใจ — Next.js Runtime เป็นตัวกำหนดเอง
  # ถ้า build ล้มเหลวเรื่อง publish path ให้เพิ่ม: publish = ".next"

[build.environment]
  # Next 16 ต้องใช้ Node >= 20.9 — ล็อกให้ตรงกับที่พัฒนา/ทดสอบ (Node 22)
  NODE_VERSION = "22"

# ── header ความปลอดภัย: ย้ายไปตั้งที่ `next.config.ts` แล้ว ────────────────────
# `headers()` ใน next.config.ts เป็นแหล่งความจริงเดียว (ใช้ได้ทั้ง Vercel และ Netlify)
# เพราะตอนตั้งไว้ที่นี่ เว็บที่ deploy บน Vercel จะไม่ได้ header เหล่านั้นเลย
# ห้ามคัดลอกกลับมาที่นี่ซ้ำ — แก้ที่ next.config.ts เท่านั้น (มีเทสต์คุมอยู่)
